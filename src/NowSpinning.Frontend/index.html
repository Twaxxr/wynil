<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>NowSpinning Wallpaper</title>
  </head>
  <body>
    <main id="scene" class="scene idle">
      <div class="window-light" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <section class="sleeve-wrap" aria-label="Current album">
        <div class="sleeve">
          <div id="cover" class="cover fallback"><span>NS</span></div>
          <div class="sleeve-copy">
            <p id="source" class="eyebrow">NOWSPINNING</p>
            <h1 id="title">Play something to begin</h1>
            <p id="artist" class="artist">Your music will appear here</p>
            <p id="album" class="album"></p>
          </div>
        </div>
      </section>
      <section class="deck" aria-label="Turntable">
        <div class="platter">
          <div id="record" class="record">
            <div class="record-sheen"></div>
            <div id="label" class="label fallback"><span>NS</span></div>
            <div class="spindle"></div>
          </div>
        </div>
        <div class="tonearm-base"><i></i></div>
        <div class="tonearm"><div class="headshell"></div></div>
        <div class="power-led"></div>
        <div class="speed-knob"></div>
        <div class="brand">NOWSPINNING · 33</div>
        <nav id="controls" class="controls" aria-label="Playback controls">
          <button data-command="previous" aria-label="Previous">‹‹</button>
          <button data-command="toggle" class="primary" aria-label="Play or pause">▶︎</button>
          <button data-command="next" aria-label="Next">››</button>
        </nav>
      </section>
      <div id="dust" class="dust" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
